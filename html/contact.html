<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <link rel="stylesheet" href="css/contact.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <section class="contact-section">
        <div class="contact-container">

            <div class="contact-header">
                <h1>Let's Work Together</h1>
                <p>
                    Have a project in mind, a freelance opportunity,
                    or just want to say hello? I'd love to hear from you.
                </p>
            </div>

            <!-- Contact Cards -->
            <div class="contact-cards">

                <a href="mailto:mdf87059@gmail.com" class="contact-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div class="contact-info">
                        <h3>Email</h3>
                        <p>mdf87059@gmail.com</p>
                    </div>
                </a>

                <a href="https://linkedin.com/in/md-faizan" target="_blank" class="contact-card">
                    <div class="card-icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </div>

                    <div class="contact-info">
                        <h3>LinkedIn</h3>
                        <p>Connect with me</p>
                    </div>
                </a>

                <a href="https://github.com/Faizan-tech7" target="_blank" class="contact-card">
                    <div class="card-icon">
                        <i class="fa-brands fa-github"></i>
                    </div>

                    <div class="contact-info">
                        <h3>GitHub</h3>
                        <p>View my repositories</p>
                    </div>
                </a>

                <div class="contact-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div class="contact-info">
                        <h3>Location</h3>
                        <p>Khammam, Telangana, India</p>
                    </div>
                </div>

            </div>

            <!-- Contact Form -->
            <form id="contactForm">

                <!-- Hidden Recipient Email -->
                <input
                    type="hidden"
                    name="to_email"
                    value="mdf87059@gmail.com"
                >

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="from_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="from_email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>

                <p id="successMessage"></p>

            </form>

        </div>
    </section>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Contact JS -->
    <script src="js/contact.js"></script>

</body>
</html>
